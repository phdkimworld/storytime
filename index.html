<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책 읽어주기</title>
<meta name="theme-color" content="#e0703a">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책 읽어주기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#fbf7f0; --card:#ffffff; --ink:#2b2622; --muted:#7a7068; --line:#ece4d8;
    --accent:#e0703a; --accent-ink:#fff; --chip:#f3ece2; --bar:#2b2622; --bar-ink:#fbf7f0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1a18; --card:#272421; --ink:#f1ebe3; --muted:#a89e94; --line:#3a3530;
      --chip:#33302c; --bar:#0f0e0d; --bar-ink:#f1ebe3; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
  header h1{font-size:20px;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
  .icon{border:0;background:var(--chip);border-radius:999px;height:36px;min-width:36px;padding:0 10px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .srow{display:flex;gap:8px;align-items:center}
  .srow .search{flex:1}
  .fbtn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;height:48px;padding:0 14px;font-size:15px;font-weight:600;flex:none}
  .fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fbtn .n{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 4px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pill{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:5px 10px;font-size:13px}
  .lhead{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
  .lhead .count{margin:0 auto 0 0;font-size:14px;color:var(--muted)}
  .pbtn{border:0;border-radius:999px;height:38px;padding:0 14px;font-size:15px;font-weight:600;background:var(--accent);color:#fff}
  .pbtn.ghost{background:var(--chip);color:var(--ink);width:38px;padding:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav button{border:0;background:transparent;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0}
  .nav button .g{font-size:22px;line-height:30px;height:30px}
  .nav button.on{color:var(--accent);font-weight:700}
  .nav .plus .g{background:#e74c3c;color:#fff;width:40px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .big-opt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:14px;font-size:17px;margin-bottom:8px;text-align:left}
  .big-opt .g{font-size:26px}
  .big-opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .search{width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--chip);padding:7px 13px;border-radius:999px;font-size:14px;white-space:nowrap}
  .chip.on{background:var(--accent);color:var(--accent-ink)}
  .actions{display:flex;gap:8px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
  .btn{border:0;border-radius:12px;padding:10px 16px;font-size:16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .count{color:var(--muted);font-size:14px;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 300px}
  .more-sentinel{grid-column:1/-1;height:1px}
  .card.playing{outline:3px solid var(--accent)}
  .meta{position:relative}
  .meta .t{padding-right:22px}
  .more{position:absolute;right:4px;top:4px;font-size:20px;line-height:1;padding:4px 8px;border-radius:10px;color:var(--muted)}
  .more:active{background:var(--chip)}
  .cover{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
  .cover .who{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:999px}
  .meta{padding:10px 11px 12px}
  .t{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}

  .player{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));border-radius:16px;z-index:3;background:var(--bar);color:var(--bar-ink);padding:8px 12px 6px;
    box-shadow:0 -6px 20px rgba(0,0,0,.15);display:none}
  .player.show{display:block}
  .pinner{max-width:1100px;margin:0 auto}
  .prow{display:flex;align-items:center;gap:4px}
  .now{flex:1;min-width:0}
  .now .nt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .ns{font-size:12.5px;opacity:.75}
  .ctl{border:0;background:transparent;font-size:20px;width:38px;height:38px;flex:none;border-radius:50%;color:var(--bar-ink)}
  .ctl.pclose{font-size:16px;width:32px;opacity:.7}
  .ctl.big{background:var(--accent);color:#fff;font-size:18px;width:44px;height:44px}
  .sleep{flex:none;border:0;background:rgba(255,255,255,.12);color:var(--bar-ink);border-radius:999px;padding:7px 10px;font-size:14px;white-space:nowrap}
  .sleep.on{background:#7b6cf6;color:#fff}
  .seek{display:flex;align-items:center;gap:8px;font-size:11px;opacity:.8;margin-top:2px}
  .seek input{height:14px}
  .seek input{flex:1;accent-color:var(--accent)}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .sheet.show{display:flex}
  .panel{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .panel h3{margin:0 0 12px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opts button{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:14px 6px;font-size:16px}
  .gate{max-width:440px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:center}
  .gate input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:16px;margin:8px 0;background:var(--bg);color:var(--ink)}
  .muted{color:var(--muted)}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite;margin:10px auto}
  @keyframes r{to{transform:rotate(360deg)}}
  .btn.rec{background:#e74c3c}
  .fpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
  .frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
  .frow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;margin:10px 0}
  .frow b{font-size:15px;color:var(--muted);font-weight:600}
  .frow .chip{padding:6px 11px;font-size:14px}
  .fsel{font:inherit;font-size:16px;padding:10px 10px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .toast.show{opacity:.92}
  .memo{margin:4px 0 14px}
  .memo h4{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
  .mrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
  .mcard{flex:0 0 min(78%,300px);scroll-snap-align:start;text-align:left;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .mcard .ago{font-size:13px;font-weight:700;opacity:.75}
  .mcard .mt{font-size:16.5px;font-weight:700;line-height:1.3}
  .mcard .ms{font-size:13px;opacity:.8}
  .krow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .krow .kp{flex:0 0 36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
  .krow.on{outline:2px solid var(--accent)}
  .khead{display:flex;align-items:center;gap:8px;margin:14px 0 2px}
  .khead b{font-size:16px;flex:1}
  .scard .cover{font-size:30px}
  @media (max-width:480px){ .grid{grid-template-columns:repeat(2,1fr);gap:10px} .cover{font-size:34px} }
</style>
</head>
<body>

<div id="gate" class="gate"><div class="spin"></div><p class="muted">불러오는 중…</p></div>

<div id="app" class="wrap" hidden>
  <header>
    <h1>📚 우리집 책 읽어주기 <span style="margin-left:auto;display:flex;gap:6px"><button id="upBadge" class="icon" hidden></button><button id="installBtn" class="icon" hidden aria-label="앱으로 설치">📲 설치</button></span></h1>
    <div class="srow">
      <input id="q" class="search" type="search" placeholder="제목·인물·키워드 찾기">
      <button id="fBtn" class="fbtn" aria-label="필터">필터<span class="n" id="fN" hidden></span></button>
    </div>
    <div id="fSum" class="pills"></div>
  </header>
  <div id="chips" class="chips"></div>
  <div class="lhead" id="lhead">
    <span class="count" id="count"></span>
    <button class="pbtn ghost" id="shuffle" aria-label="섞어서 재생">🔀</button>
    <button class="pbtn" id="playAll">▶ 모두 재생</button>
  </div>
  <input id="fileIn" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.amr,.3gp,.ogg,.opus" multiple hidden>
  <div id="memo" class="memo" hidden></div>
  <div id="grid" class="grid"></div>
</div>

<div id="player" class="player">
  <div class="pinner">
    <div class="prow">
      <div class="now"><div class="nt" id="nt">-</div><div class="ns" id="ns"></div></div>
      <button class="ctl" id="prev" aria-label="이전">⏮</button>
      <button class="ctl big" id="pp" aria-label="재생/일시정지">▶</button>
      <button class="ctl" id="next" aria-label="다음">⏭</button>
      <button class="sleep" id="sleepBtn" aria-label="잠자기 타이머">😴</button>
      <button class="ctl pclose" id="pClose" aria-label="플레이어 닫기">✕</button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input id="bar" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
</div>

<div id="sheet" class="sheet">
  <div class="panel">
    <h3>😴 잠자기 타이머</h3>
    <div class="opts" id="opts"></div>
    <p class="muted" style="font-size:13px;margin:12px 0 0">끝나기 전 15초 동안 소리가 천천히 작아져요.</p>
  </div>
</div>

<div id="recSheet" class="sheet">
  <div class="panel" style="text-align:center">
    <h3>🎙 책 읽어주기 녹음</h3>
    <div id="recTime" style="font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0">0:00</div>
    <div id="recLevel" style="height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:0 0 16px"><div style="height:100%;width:0;background:#e74c3c;transition:width .1s"></div></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn ghost" id="recPause" style="font-size:18px;padding:14px 18px">⏸ 잠시 멈춤</button>
      <button class="btn" id="recStop" style="background:#e74c3c;font-size:18px;padding:14px 22px">■ 끝내고 올리기</button>
      <button class="btn ghost" id="recCancel">취소</button>
    </div>
    <p class="muted" style="font-size:13px;margin:14px 0 0">화면이 꺼지면 그동안은 녹음이 안 될 수 있어요. 다시 켜면 이어서 녹음해요.</p>
  </div>
</div>
<nav class="nav" id="nav" hidden>
  <button data-tab="stories" class="on"><span class="g">📚</span>이야기</button>
  <button data-tab="history"><span class="g">🎧</span>들은 것</button>
  <button data-tab="add" class="plus" id="addTab" hidden><span class="g">＋</span>녹음·올리기</button>
  <button data-tab="log"><span class="g">🗂</span>기록</button>
</nav>
<div id="fSheet" class="sheet">
  <div class="panel">
    <div style="display:flex;align-items:center"><h3 style="margin:0">필터</h3><button class="icon" id="fClear" style="margin-left:auto">초기화</button></div>
    <div id="fPanel"></div>
    <p class="muted" style="font-size:12.5px;margin:4px 0 12px">모르는 녹음은 그 필터를 고르면 빠져요</p>
    <button class="btn" id="fDone" style="width:100%">결과 보기</button>
  </div>
</div>
<div id="addSheet" class="sheet">
  <div class="panel">
    <h3>이야기 더하기</h3>
    <button class="big-opt" id="recBtn"><span class="g">🎙</span><span>지금 녹음하기<small>책을 읽으면서 바로 녹음</small></span></button>
    <button class="big-opt" id="fileBtn"><span class="g">📁</span><span>파일 올리기<small>휴대폰에 있는 녹음·영상</small></span></button>
  </div>
</div>
<div id="toast" class="toast"></div>
<audio id="au" preload="auto"></audio>

<script>
(function(){
  // ───── 저장소 (실패해도 동작) ─────
  const ls = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }

  let items = [], byId = {}, filter = ls.get('filter', 'recent'), query = '';
  let queue = [], qi = -1, loadingId = null;
    const au = $('au');

  const EMOJI = {'영어책':'🔤','옛이야기':'🐯','명작동화':'👑','영어동화':'🔤','생활동화':'🌱','직업동화':'👩‍🚒','지식책':'🔭','과학동화':'🔬','수학그림책':'🔢','전래동화':'🐯','세계명작':'👑','세계 민담':'🌍','그림책':'🎨','과학·지식':'🔭','생활·습관':'🪥','기타':'📖'};
  const PALETTE = ['#f6c89f','#a8d5ba','#9cc3e6','#f2a7a7','#c9b6e4','#f5d76e','#b5d99c','#f7b7d2','#a7d8d8','#e8c39e'];
  const hash = s => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };

  // ───── 시작: 가족 암호로 목록 열기 ─────
  const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  // 큰 base64(목록 1.9MB)는 브라우저 내장 해독으로(한 글자씩 하면 폰에서 1초 넘게 걸림)
  const b64big = async x => Uint8Array.fromBase64 ? Uint8Array.fromBase64(x)
    : new Uint8Array(await (await fetch('data:application/octet-stream;base64,' + x)).arrayBuffer());
  // 암호에서 열쇠 만들기(PBKDF2 21만 번)는 폰에서 느려서, 만든 열쇠를 이 폰 안(IndexedDB, 꺼낼 수 없는 형태)에 기억
  function kdb(){ return new Promise((res, rej) => { const r = indexedDB.open('storytime-key', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function kGet(tag){ try { const d = await kdb(); return await new Promise(r => { const t = d.transaction('k').objectStore('k').get(tag); t.onsuccess = () => r(t.result || null); t.onerror = () => r(null); }); } catch (e) { return null; } }
  async function kPut(tag, key){ try { const d = await kdb(); d.transaction('k', 'readwrite').objectStore('k').put(key, tag); } catch (e) {} }
  async function decrypt(enc, pass){
    const tag = enc.salt + ':' + enc.iter + ':' + (await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass)).then(h => toB64(new Uint8Array(h)).slice(0, 16)));
    let key = await kGet(tag), fresh = !key;
    if (!key){
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    }
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, await b64big(enc.ct));
    if (fresh) kPut(tag, key);
    return JSON.parse(new TextDecoder().decode(pt));
  }
  let ENC = null;
  fetch('catalog.enc?v=' + Date.now()).then(r => r.json()).then(enc => {
    ENC = enc;
    const saved = ls.get('pass', '');
    if (saved) return decrypt(enc, saved).then(start).catch(() => showLock(''));
    showLock('');
  }).catch(() => { $('gate').innerHTML = '<p>목록을 불러오지 못했어요.</p><p class="muted">인터넷 연결을 확인해 주세요.</p>'; });

  function showLock(msg){
    $('gate').hidden = false; $('app').hidden = true;
    $('gate').innerHTML =
      '<h2>📚 우리집 책 읽어주기</h2>' +
      '<p class="muted">가족 암호를 넣어 주세요.</p>' +
      '<form id="lf"><input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="가족 암호">' +
      '<button class="btn" style="width:100%;margin-top:6px">열기</button></form>' +
      (msg ? '<p style="color:#c0392b">'+esc(msg)+'</p>' : '');
    $('pw').focus();
    $('lf').onsubmit = e => {
      e.preventDefault();
      const p = $('pw').value;
      decrypt(ENC, p).then(cat => { ls.set('pass', p); start(cat); }).catch(() => showLock('암호가 맞지 않아요.'));
    };
  }

  let AKEY = null, ENCKEY = null, CATKEY = null;
  // 앱을 켜 둔 채로도 새 이야기가 보이게: 5분마다·앱으로 돌아올 때 목록을 다시 받아 바뀌었으면 반영
  let LAST = null;
  async function refreshCatalog(){
    try{
      const pass = ls.get('pass', ''); if (!pass || !LAST) return;
      const enc = await (await fetch('catalog.enc?v=' + Date.now(), {cache:'no-store'})).json();
      const cat = await decrypt(enc, pass);
      if (cat.updated === LAST) return;
      const before = new Set(items.map(i => i.id));
      apply(cat);
      const n = items.filter(i => !before.has(i.id)).length;
      if (n) toast('새 이야기 ' + n + '개가 들어왔어요');
    }catch(e){}
  }
  setInterval(() => { if (document.visibilityState === 'visible') refreshCatalog(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshCatalog(); });
  function apply(cat){
    LAST = cat.updated;
    ENCKEY = cat.key;
    AKEY = cat.key ? crypto.subtle.importKey('raw', b64(cat.key), 'AES-GCM', false, ['decrypt']) : null;
    CATKEY = cat.key ? b64(cat.key) : null;
    items = (cat.items || []).map((it, i) => Object.assign({ord:i}, it));
    byId = {}; items.forEach(it => byId[it.id] = it);
    // 아직 맥이 반영하지 않은 제목 고치기는 앱에서 먼저 보여 줌
    const rt = ls.get('retitle', {});
    for (const k in rt){ const it = byId[k]; if (!it || it.title === rt[k]) delete rt[k]; else { it.title = rt[k]; it.untitled = false; } }
    ls.set('retitle', rt);
    FAM = cat.family || null;
    // 시리즈: 규칙(제목 정규식·키워드)에 맞는 첫 시리즈로 자동 묶음. 새 녹음도 제목만 맞으면 저절로 들어감
    SERIES = (cat.series || []).map(r => { let re = null; try { re = r.t ? new RegExp(r.t, 'i') : null; } catch (e) {}
      let sr = null, xr = null; try { sr = r.s ? new RegExp(r.s, 'i') : null; xr = r.x ? new RegExp(r.x, 'i') : null; } catch (e) {}
      return {n: r.n, re, sr, xr, k: new Set(r.k || [])}; });
    // 규칙(제목·키워드·줄거리)이 먼저, 없으면 맥이 받아쓴 내용으로 찾은 묶음(series_auto: 주인공 이름·작가)
    // 앱에서 고친 시리즈(맥이 아직 반영 안 한 것)를 먼저 덮어씀
    const sf = ls.get('serfix', {});
    for (const k in sf){ const it = byId[k], f = sf[k]; if (!it){ delete sf[k]; continue; }
      const no = new Set(it.series_no || []), done = f.no.every(x => no.has(x)) && ('to' in f ? (f.to === null ? !('series_manual' in it) : it.series_manual === f.to) : true);
      if (done && Date.now() - f.t > 6e4){ delete sf[k]; continue; }
      it.series_no = [...new Set([...(it.series_no || []), ...f.no])];
      if ('to' in f){ if (f.to === null) delete it.series_manual; else it.series_manual = f.to; } }
    ls.set('serfix', sf);
    items.forEach(assignSeries);
    R2 = cat.r2 && cat.r2.url && cat.r2.k ? cat.r2 : null;
    LOG = cat.log || []; DELETED = new Set(cat.deleted || []);
    const u = ls.get('undo', {}); for (const k in u) if (byId[k] || u[k] < Date.now() - 864e5) delete u[k]; ls.set('undo', u);
    const h = ls.get('hidden', {}); for (const k in h) if (!byId[k]) delete h[k]; ls.set('hidden', h);
    if (cat.inbox && !INBOX) setupUpload(cat.inbox);
    buildChips(); buildFilters(); $('nav').hidden = false; setTab(filter === 'history' || filter === 'log' ? filter : 'stories', true); render();
  }

  function start(cat){
    $('gate').hidden = true; $('app').hidden = false;
    apply(cat); setupInstall();
    try { if (!history.state) history.replaceState({f: filter}, ''); } catch (e) {}
  }


  // ───── 녹음·파일 올리기 (암호화해서 비공개 녹음함 저장소로) ─────
  // 올릴 파일 = AES-GCM(콘텐츠 키, [4바이트 머리 길이][머리 JSON][원본 소리]) — 맥 처리기가 풀어서 목록에 추가
  let INBOX = null;
  const DB = 'storytime-up', ST = 'q';
  function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, {keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function qAll(){ try{ const d = await idb(); return await new Promise(r => { const t = d.transaction(ST).objectStore(ST).getAll(); t.onsuccess = () => r((t.result || []).filter(x => !x.id.startsWith('draft:'))); t.onerror = () => r([]); }); }catch(e){ return []; } }
  async function qPut(x){ const d = await idb(); return new Promise((r, j) => { const t = d.transaction(ST, 'readwrite'); t.objectStore(ST).put(x); t.oncomplete = r; t.onerror = () => j(t.error); }); }
  async function qGet(id){ try{ const d = await idb(); return await new Promise(r => { const t = d.transaction(ST).objectStore(ST).get(id); t.onsuccess = () => r(t.result || null); t.onerror = () => r(null); }); }catch(e){ return null; } }
  async function qDel(id){ const d = await idb(); return new Promise(r => { const t = d.transaction(ST, 'readwrite'); t.objectStore(ST).delete(id); t.oncomplete = r; t.onerror = r; }); }
  function toB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  const extOf = (name, mime) => (name && /\.([a-z0-9]{2,4})$/i.test(name)) ? RegExp.$1.toLowerCase()
    : /webm/.test(mime) ? 'webm' : /ogg/.test(mime) ? 'ogg' : /mpeg/.test(mime) ? 'mp3' : /wav/.test(mime) ? 'wav' : 'm4a';

  // parts: 화면이 꺼졌다 켜져서 녹음이 여러 조각이면 조각 크기 목록. 맥이 이어 붙임
  async function enqueue(blob, kind, name, parts, at){
    const head = new TextEncoder().encode(JSON.stringify({kind, name: name || '', mime: blob.type || '', size: blob.size,
      parts: parts && parts.length > 1 ? parts : undefined,
      at: at || new Date().toISOString(), ua: navigator.userAgent.slice(0, 120)}));
    const body = new Uint8Array(await blob.arrayBuffer());
    const pt = new Uint8Array(4 + head.length + body.length);
    new DataView(pt.buffer).setUint32(0, head.length); pt.set(head, 4); pt.set(body, 4 + head.length);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await AKEYW, pt));
    const enc = new Uint8Array(12 + ct.length); enc.set(iv); enc.set(ct, 12);
    const ts = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
    const id = ts + '_' + kind + '_' + Math.random().toString(36).slice(2, 8);
    await qPut({id, path: 'inbox/' + id + '.' + extOf(name, blob.type) + '.bin', data: enc});
    badge(); flush();
  }
  let flushing = false, again = false;
  async function flush(){
    if (!INBOX) return;
    if (flushing){ again = true; return; }   // 올리는 중에 새 파일이 들어오면 끝난 뒤 다시 돎
    flushing = true;
    let failed = false;
    try{
      do { again = false;
      for (const x of await qAll()){
        const r = await fetch('https://api.github.com/repos/' + INBOX.repo + '/contents/' + x.path, {method:'PUT',
          headers:{'Authorization':'Bearer ' + INBOX.token, 'Accept':'application/vnd.github+json'},
          body: JSON.stringify({message:'녹음 올림 ' + x.id, content: toB64(x.data)})});
        if (r.ok || r.status === 422){ await qDel(x.id); if (!x.id.startsWith('req_')){ const left = (await qAll()).filter(y => !y.id.startsWith('req_')).length; toast(left ? '올리는 중… ' + left + '개 남음' : '다 올렸어요. 20분쯤 뒤 목록에 나와요'); } }
        else { toast('올리기 실패(' + r.status + '): 나중에 다시 올릴게요'); failed = true; break; }
        badge();
      }
      } while (again && !failed);
    }catch(e){ toast('인터넷이 연결되면 다시 올릴게요'); }
    finally{ flushing = false; badge(); }
  }
  async function badge(){ const n = (await qAll()).filter(x => !x.id.startsWith('req_')).length; $('upBadge').hidden = !n; $('upBadge').textContent = '⬆️ 올리는 중 ' + n; }
  window.addEventListener('online', () => flush());

  let AKEYW = null;
  function setupUpload(inbox){
    if (!inbox || !inbox.repo || !inbox.token) return;
    INBOX = inbox;
    AKEYW = crypto.subtle.importKey('raw', b64(ENCKEY), 'AES-GCM', false, ['encrypt']);
    $('addTab').hidden = false;
    recoverDraft();
    $('fileBtn').onclick = () => { $('addSheet').classList.remove('show'); $('fileIn').click(); };
    $('fileIn').onchange = async e => {
      const fs = [...e.target.files]; e.target.value = '';
      for (const f of fs){
        if (f.size > 70 * 1024 * 1024){ toast(f.name + ': 70MB가 넘어서 올릴 수 없어요'); continue; }
        toast('준비 중: ' + f.name); await enqueue(f, 'file', f.name);
      }
    };
    $('recBtn').onclick = () => { $('addSheet').classList.remove('show'); startRec(); };
    badge(); flush();
  }

  // 오래된 녹음 불러오기: 녹음함에 요청을 남기면 맥이 1시간 안에 앱으로 되돌림(그 뒤 90일 유지)
  function coldSheet(it){
    const d = document.createElement('div'); d.className = 'sheet show';
    d.innerHTML = '<div class="panel"><h3>☁️ ' + esc(it.title) + '</h3>' +
      '<p class="muted" style="line-height:1.5;margin-top:0">오래된 녹음이라 지금은 Drive에만 있어요. 앱으로 불러오면 한 시간쯤 뒤부터 앱에서 들을 수 있고, 그 뒤 석 달 동안은 앱에 남아 있어요.</p>' +
      (INBOX ? '<button class="btn" data-a="pull" style="width:100%;margin-bottom:8px">📥 앱으로 불러오기</button>' : '') +
      '<button class="btn ghost" data-a="drive" style="width:100%;margin-bottom:8px">Drive에서 바로 열기</button>' +
      '<button class="btn ghost" data-a="x" style="width:100%">닫기</button></div>';
    d.onclick = async e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (e.target !== d && !a) return;
      d.remove();
      if (a === 'drive') window.open('https://drive.google.com/drive/search?q=' + encodeURIComponent(it.drive || it.title), '_blank');
      if (a === 'pull'){
        const ts = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
        await qPut({id: 'req_' + ts + '_' + it.id, path: 'requests/' + ts + '_' + it.id + '.json',
                    data: new TextEncoder().encode(JSON.stringify({id: it.id, at: new Date().toISOString()}))});
        const m = ls.get('asked', {}); m[it.id] = Date.now(); ls.set('asked', m);
        toast('불러오기를 요청했어요. 한 시간쯤 뒤 앱에서 들을 수 있어요'); render(); flush();
      }
    };
    document.body.appendChild(d);
  }

  // 더보기: 목록에서 삭제 (요청을 녹음함에 남기면 맥이 다음 실행 때 목록·사이트에서 뺌. Drive 원본은 그대로)
  function moreSheet(it){
    if (!it) return;
    const d = document.createElement('div'); d.className = 'sheet show';
    d.innerHTML = '<div class="panel"><h3>' + esc(it.title) + '</h3>' +
      '<button class="btn ghost" data-a="edit" style="width:100%;margin-bottom:8px">✏️ 제목 고치기</button>' +
      '<button class="btn ghost" data-a="ser" style="width:100%;margin-bottom:8px">📚 시리즈 고치기' + (it.series ? ' (' + esc(it.series) + ')' : '') + '</button>' +
      '<button class="btn ghost" data-a="del" style="width:100%;margin-bottom:8px;color:#c0392b">🗑 목록에서 삭제</button>' +
      '<button class="btn ghost" data-a="x" style="width:100%">닫기</button></div>';
    d.onclick = e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (e.target !== d && !a) return;
      if (a === 'edit'){ d.remove(); editTitle(it); return; }
      if (a === 'ser'){ d.remove(); seriesSheet(it); return; }
      if (a !== 'del'){ d.remove(); return; }
      d.querySelector('.panel').innerHTML = '<h3>정말 삭제할까요?</h3><p class="muted" style="line-height:1.5;margin-top:0">' + esc(it.title) +
        ' — 앱 목록에서 사라져요. 원본 파일은 Drive에 그대로 남아요.</p>' +
        '<button class="btn" data-a="yes" style="width:100%;margin-bottom:8px;background:#c0392b">삭제</button>' +
        '<button class="btn ghost" data-a="x" style="width:100%">취소</button>';
      d.onclick = async e2 => {
        const b = e2.target.dataset && e2.target.dataset.a;
        if (e2.target !== d && !b) return;
        d.remove();
        if (b !== 'yes') return;
        const ts = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
        await qPut({id: 'req_' + ts + '_del_' + it.id, path: 'requests/' + ts + '_del_' + it.id + '.json',
                    data: new TextEncoder().encode(JSON.stringify({id: it.id, action: 'delete', at: new Date().toISOString()}))});
        const h = ls.get('hidden', {}); h[it.id] = Date.now(); ls.set('hidden', h);
        if (queue[qi] === it.id && !au.paused) au.pause();
        toast('삭제했어요'); render(); flush();
      };
    };
    document.body.appendChild(d);
  }

  // 제목 고치기: 앱에는 바로 바뀌고, 요청을 녹음함에 남기면 맥이 목록에 반영(이후 AI가 제목을 다시 바꾸지 않음)
  function editTitle(it){
    const d = document.createElement('div'); d.className = 'sheet show';
    d.innerHTML = '<div class="panel"><h3>제목 고치기</h3>' +
      '<input id="etIn" class="search" style="width:100%;margin-bottom:12px" maxlength="80">' +
      '<button class="btn" data-a="ok" style="width:100%;margin-bottom:8px">저장</button>' +
      '<button class="btn ghost" data-a="x" style="width:100%">취소</button></div>';
    document.body.appendChild(d);
    const inp = d.querySelector('#etIn'); inp.value = it.title || ''; setTimeout(() => { inp.focus(); inp.select(); }, 50);
    const save = async () => {
      const t = inp.value.trim().replace(/\s+/g, ' ');
      d.remove();
      if (!t || t === it.title) return;
      const ts = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
      await qPut({id: 'req_' + ts + '_edit_' + it.id, path: 'requests/' + ts + '_edit_' + it.id + '.json',
                  data: new TextEncoder().encode(JSON.stringify({id: it.id, action: 'edit', title: t, at: new Date().toISOString()}))});
      const r = ls.get('retitle', {}); r[it.id] = t; ls.set('retitle', r);
      it.title = t; it.untitled = false;
      toast('제목을 바꿨어요'); render(); flush();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    d.onclick = e => { const a = e.target.dataset && e.target.dataset.a; if (a === 'ok') save(); else if (a === 'x' || e.target === d) d.remove(); };
  }

  // 녹음기
  // ───── 앱 안 녹음기 ─────
  // 화면을 꺼도 계속 녹음: 안드로이드 크롬은 마이크가 켜진 채 계속 녹음됨.
  // 아이폰처럼 화면이 꺼지면 마이크가 끊기는 기기는, 다시 켜는 순간 자동으로 이어서 녹음하고(조각) 끝낼 때 한 파일로 올림.
  // 5초마다 휴대폰 저장소에 임시 저장 → 앱이 강제로 꺼져도 다음에 열 때 자동으로 올림.
  let rec = null, chunks = [], recT0 = 0, recTick = null, wake = null, recStream = null, ana = null;
  let recParts = [], recOn = false, recAt = '', recMime = '', restarting = false;
  let recPaused = false, pausedAt = 0, pausedMs = 0;   // 잠시 멈춤: 멈춘 동안은 녹음도 시간도 안 감
  const recSecs = () => (Date.now() - recT0 - pausedMs - (recPaused ? Date.now() - pausedAt : 0)) / 1000;
  const DRAFT = 'draft:rec';
  const pickType = () => ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  async function saveDraft(){
    try{ await qPut({id: DRAFT, at: recAt, t0: recT0, saved: Date.now(), mime: recMime, parts: recParts.slice(), cur: chunks.slice()}); }catch(e){}
  }
  async function openMic(){
    recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:true}});
    const type = pickType();
    rec = new MediaRecorder(recStream, type ? {mimeType:type, audioBitsPerSecond:64000} : undefined);
    recMime = rec.mimeType || type || 'audio/mp4';
    chunks = [];
    const me = rec;
    rec.ondataavailable = e => { if (e.data.size){ chunks.push(e.data); saveDraft(); } };
    rec.onstop = () => { if (me._final) return; closePart(); };   // 기기가 녹음을 끊음 → 조각으로 보관
    recStream.getAudioTracks().forEach(t => t.addEventListener('ended', () => { if (rec === me && me.state !== 'inactive') try{ me.stop(); }catch(e){} }));
    watchMute(recStream);
    rec.start(5000);
    try{ ana && ana.ac.close(); }catch(e){}
    try{ const ac = new AudioContext(); const an = ac.createAnalyser(); ac.createMediaStreamSource(recStream).connect(an); ana = {ac, an, buf:new Uint8Array(an.fftSize)}; }catch(e){ ana = null; }
    try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function closePart(){
    if (chunks.length) recParts.push(new Blob(chunks, {type: recMime}));
    chunks = []; rec = null;
    try{ recStream && recStream.getTracks().forEach(t => t.stop()); }catch(e){}
    saveDraft();
  }

  let mutedAt = 0, mutedMs = 0;
  function watchMute(stream){
    stream.getAudioTracks().forEach(t => {
      t.addEventListener('mute', () => { mutedAt = Date.now(); });
      t.addEventListener('unmute', () => { if (mutedAt){ mutedMs += Date.now() - mutedAt; mutedAt = 0; } });
    });
  }

  async function startRec(){
    if (!au.paused) au.pause();
    recParts = []; recAt = new Date().toISOString(); recT0 = Date.now(); mutedMs = 0; mutedAt = 0;
    recPaused = false; pausedAt = 0; pausedMs = 0; pauseUi();
    try{ await openMic(); }
    catch(e){ return toast('마이크를 쓸 수 없어요. 브라우저 마이크 권한을 허용해 주세요'); }
    recOn = true;
    recTick = setInterval(() => {
      $('recTime').textContent = fmt(recSecs());
      if (recPaused){ $('recLevel').firstChild.style.width = '0'; return; }
      if (ana){ ana.an.getByteTimeDomainData(ana.buf); let m = 0; for (const v of ana.buf) m = Math.max(m, Math.abs(v - 128)); $('recLevel').firstChild.style.width = Math.min(100, m * 1.6) + '%'; }
    }, 200);
    $('recTime').textContent = '0:00'; $('recSheet').classList.add('show');
  }
  // 화면을 다시 켰을 때: 기기가 녹음을 끊었으면 바로 이어서 녹음
  async function resumeIfCut(){
    if (!recOn || restarting || recPaused) return;
    const tr = recStream ? recStream.getAudioTracks() : [];
    const live = rec && rec.state === 'recording' && tr.some(t => t.readyState === 'live' && !t.muted);
    if (mutedAt){ mutedMs += Date.now() - mutedAt; mutedAt = 0; }
    if (mutedMs > 3000){ toast('화면이 꺼진 ' + fmt(mutedMs / 1000) + ' 동안은 소리가 안 들어갔어요'); mutedMs = 0; }
    if (live){ if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w).catch(()=>{}); return; }
    restarting = true;
    if (rec && rec.state !== 'inactive'){ await new Promise(r => { const m = rec; m._final = true; m.onstop = () => { closePart(); r(); }; try{ m.stop(); }catch(e){ closePart(); r(); } }); }
    try{ await openMic(); toast('화면이 꺼져 있던 동안 멈췄던 녹음을 이어서 해요'); }
    catch(e){ toast('마이크가 끊겼어요. 지금까지 녹음은 보관돼 있어요'); }
    restarting = false;
  }
  async function packAndSend(parts, at, mime){
    if (!parts.length) return false;
    const blob = new Blob(parts, {type: mime || parts[0].type || 'audio/mp4'});
    await enqueue(blob, 'rec', '', parts.map(p => p.size), at);
    return true;
  }
  function endRec(keep){
    return new Promise(res => {

    toast(byId[id] ? '되돌렸어요: ' + title : '되돌리기 요청: 20분쯤 뒤 목록에 다시 나와요');

  }

  // ───── 아래 탭: 이야기 · 들은 것 · 녹음 · 기록 ─────
  function setTab(t, quiet){
    if (t === 'add'){ $('addSheet').classList.add('show'); return; }
    if (t === 'stories'){ if (filter === 'history' || filter === 'log') filter = ls.get('listFilter', 'recent'); }
    else filter = t;
    ls.set('filter', filter);
    const tab = filter === 'history' || filter === 'log' ? filter : 'stories';
    [...$('nav').querySelectorAll('[data-tab]')].forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('chips').hidden = tab !== 'stories';
    document.querySelector('.srow').hidden = $('fSum').hidden = tab === 'log';
    $('lhead').querySelectorAll('.pbtn').forEach(b => b.hidden = tab === 'log');
    if (!quiet){ $('q').value = ''; query = ''; render(); window.scrollTo(0, 0); }
  }
  $('nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b){ setTab(b.dataset.tab); if (b.dataset.tab !== 'add') navPush(); } });

  // ───── 뒤로 가기: 앱이 꺼지지 않고 이전 탭·목록으로. 열린 창(시트)이 있으면 그것부터 닫음 ─────
  let navIgnore = 0, popClose = 0, lastSheets = 0;
  function navPush(){ const st = history.state; if (st && st.f === filter && !st.s) return; history.pushState({f: filter}, ''); }
  const openSheets = () => [...document.querySelectorAll('.sheet.show')];
  new MutationObserver(() => {
    const n = openSheets().length, d = n - lastSheets; lastSheets = n;
    if (d > 0) for (let i = 0; i < d; i++) history.pushState({f: filter, s: 1}, '');
    else if (d < 0){ let k = -d; const p = Math.min(k, popClose); popClose -= p; k -= p; if (k > 0){ navIgnore++; history.go(-k); } }
  }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['class']});
  window.addEventListener('popstate', e => {
    if (navIgnore){ navIgnore--; return; }
    const sh = openSheets();
    if (sh.length){ const el = sh[sh.length - 1]; popClose++; if (el.id) el.classList.remove('show'); else el.remove(); return; }
    const f = (e.state && e.state.f) || 'recent';
    if (f === filter) return;
    filter = f; ls.set('filter', filter);
    if (filter !== 'history' && filter !== 'log') ls.set('listFilter', filter);

  });

    renderMemo();

    $('lhead').querySelectorAll('.pbtn').forEach(b => b.hidden = special);
    if (filter === 'log' && !query) return renderLog();
    if (filter === 'series' && !query) return renderSeries();
    if (filter === 'kid' && !query) return renderKid();
    const list = visible();
    ASKED = ls.get('asked', {});
    $('count').textContent = (query ? '검색 결과 ' : '') + list.length + '개';
    if (!query && filter.startsWith('ser:'))
      $('count').innerHTML = '<button class="chip" data-back="series">← 시리즈</button> <b>' + esc(filter.slice(4)) + '</b> · ' + list.length + '개';
    if (!list.length){ $('grid').innerHTML = '<div class="empty">'+(query?'찾는 이야기가 없어요.':'아직 없어요.')+'</div>'; return; }
    LIST = list; SHOWN = 0;
    $('grid').innerHTML = '';
    moreCards();
  }
  // 카드는 40개씩: 처음에 40개, 끝에 가까워지면 다음 40개(1,600개를 한꺼번에 그리면 폰에서 몇 초씩 걸림)
  let LIST = [], SHOWN = 0, ASKED = {};
  const sentinelObs = 'IntersectionObserver' in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) moreCards(); }, {rootMargin: '1200px'}) : null;
  function moreCards(){
    const g = $('grid'), old = g.querySelector('.more-sentinel'); if (old){ sentinelObs && sentinelObs.unobserve(old); old.remove(); }
    const next = LIST.slice(SHOWN, SHOWN + (SHOWN ? 60 : 40)); SHOWN += next.length;
    g.insertAdjacentHTML('beforeend', next.map(cardHtml).join(''));
    if (SHOWN < LIST.length){
      const sn = document.createElement('div'); sn.className = 'more-sentinel'; g.appendChild(sn);
      if (sentinelObs) sentinelObs.observe(sn); else while (SHOWN < LIST.length) moreCards();

  }
  function cardHtml(it){
      const cur = queue[qi];
      const bg = PALETTE[hash(it.title) % PALETTE.length];
      const who = it.reader && it.reader !== '모름' ? '<span class="who">'+esc(it.reader)+'</span>' : '';

      const cold = isCold(it) ? '<span class="who" style="left:auto;right:8px;background:' + (asked ? '#c98a1b' : '#3d6bd6') + '">' + (asked ? '⏳ 불러오는 중' : '☁️ Drive 보관') + '</span>' : '';
      return '<button class="card'+(it.id===cur?' playing':'')+'" data-id="'+esc(it.id)+'">' +
        '<div class="cover" style="background:'+bg+(isCold(it)?';opacity:.55':'')+'">'+who+cold+(EMOJI[it.category]||'📖')+'</div>' +
        '<div class="meta"><div class="t">'+esc(it.title)+'</div>' + (INBOX ? '<span class="more" data-more="'+esc(it.id)+'" aria-label="더보기">⋯</span>' : '') +
        (it.summary?'<div class="s">'+esc(it.summary)+'</div>':'') +

          recOf(it) && FAM ? '리나 ' + keyL(it) + '·둥이 ' + Math.max(0, keyT(it)) + '세' : ''].filter(Boolean).join(' · ') + '</div>' + '</div></button>';
  }
  // 재생 중 표시는 목록을 다시 그리지 않고 테두리만 옮김

    const it = byId[c.dataset.id];

  });
  const kidAll = sh => { const ix = KC.map((_, i) => i); if (sh) for (let i = ix.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [ix[i],ix[j]] = [ix[j],ix[i]]; } if (ix.length) playClips(ix, 0); };
  $('playAll').onclick = () => { if (filter === 'kid' && !query) return kidAll(false); const ids = visible().filter(i => !isCold(i)).map(i=>i.id); if (ids.length) playQueue(ids, 0); };
  $('shuffle').onclick = () => {
    if (filter === 'kid' && !query) return kidAll(true);
    const ids = visible().filter(i => !isCold(i)).map(i=>i.id);
    for (let i = ids.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [ids[i],ids[j]] = [ids[j],ids[i]]; }
    if (ids.length) playQueue(ids, 0);
  };

  // ───── 📚 시리즈: 시리즈마다 카드 하나, 누르면 그 시리즈 목록(제목 순) ─────
  function renderSeries(){
    const h = hiddenNow(), by = {};
    for (const it of items) if (it.series && passF(it) && !h[it.id]) (by[it.series] = by[it.series] || []).push(it);
    const names = Object.keys(by).sort((a, b) => by[b].length - by[a].length || a.localeCompare(b, 'ko'));
    $('count').textContent = '시리즈 ' + names.length + '개';
    if (!names.length){ $('grid').innerHTML = '<div class="empty">아직 묶인 시리즈가 없어요.</div>'; return; }
    $('grid').innerHTML = names.map(n => {
      const l = by[n], who = [...new Set(l.map(readerOf).filter(Boolean))].join('·');
      const em = EMOJI[(l.find(i => i.category) || {}).category] || '📚';
      return '<button class="card scard" data-ser="' + esc(n) + '"><div class="cover" style="background:' + PALETTE[hash(n) % PALETTE.length] + '">' + em + '</div>' +
        '<div class="meta"><div class="t">' + esc(n) + '</div><div class="s">📚 ' + new Set(l.map(i => i.title.replace(/\s+/g, ''))).size + '권 · 녹음 ' + l.length + '개' + (who ? ' · ' + who : '') + '</div></div></button>';
    }).join('');
  }

  // ───── ✨ 그때 오늘: 지난 해 같은 날(앞뒤 며칠) 녹음 ─────
  const doy = d => { const [y, m, x] = d.split('-').map(Number); return (Date.UTC(2001, m - 1, x) - Date.UTC(2001, 0, 1)) / 864e5; };
  let MEMO = [];
  function renderMemo(){
    const box = $('memo');
    const show = filter === 'recent' && !query && !$('chips').hidden;
    if (!show){ box.hidden = true; return; }
    const now = new Date(), today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const t = doy(today), h = hiddenNow();
    const near = w => items.filter(i => recOf(i) && recOf(i) < today && !h[i.id] && passF(i)).map(i => {
      const dd = Math.abs(doy(recOf(i)) - t), d = Math.min(dd, 365 - dd);
      const ago = Math.round((new Date(today) - new Date(recOf(i))) / (365.25 * 864e5));
      return {it: i, d, ago};
    }).filter(x => x.d <= w && x.ago >= 1);
    let c = near(3); if (!c.length) c = near(10);
    const by = {};
    for (const x of c){ const o = by[x.ago]; const r = (hash(x.it.id + today) % 1000) / 1000;
      if (!o || x.d < o.d || (x.d === o.d && r < o.r)) by[x.ago] = Object.assign(x, {r}); }
    MEMO = Object.keys(by).map(Number).sort((a, b) => a - b).slice(0, 4).map(k => by[k]);
    if (!MEMO.length){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<h4>✨ 그때 오늘</h4><div class="mrow">' + MEMO.map((x, i) => {
      const it = x.it, r = recOf(it), k = (it.kidv || 0) >= 2 ? (it.kid || [])[0] : null;
      const ages = FAM ? ['리나 ' + Math.max(0, keyL(it)) + '세', keyT(it) >= 0 ? '둥이 ' + keyT(it) + '세' : '둥이 태어나기 전'].join(' · ') : '';
      return '<button class="mcard" data-mi="' + i + '" style="background:' + PALETTE[hash(it.title) % PALETTE.length] + '">' +
        '<span class="ago">📅 ' + x.ago + '년 전 ' + (x.d === 0 ? '오늘' : '이맘때') + ' · ' + r.replace(/-/g, '.') + '</span>' +
        '<span class="mt">' + esc(it.title) + '</span>' +
        '<span class="ms">' + [ages, readerOf(it) ? readerOf(it) + '가 읽어줌' : ''].filter(Boolean).join(' · ') + '</span>' +
        (k && k[3] ? '<span class="ms">👶 "' + esc(k[3]) + '"</span>' : '') + '<span class="ms" style="font-weight:700">▶ 그때 목소리 듣기</span></button>';
    }).join('') + '</div>';
  }
  $('memo').addEventListener('click', e => {
    const b = e.target.closest('[data-mi]'); if (!b) return;
    const it = MEMO[Number(b.dataset.mi)].it;
    if (isCold(it)) return coldSheet(it);
    const ids = MEMO.map(x => x.it).filter(i => !isCold(i)).map(i => i.id);
    playQueue(ids, ids.indexOf(it.id));
  });

  // ───── 👶 아이 목소리 모음: 녹음 속 아이 목소리 순간을 그때 나이별로 ─────
  let KC = [], KG = [], KOPEN = new Set();
  const kidNo = () => ls.get('kidno', {});
  function renderKid(){
    const h = hiddenNow(), no = kidNo();
    KC = [];
    for (const it of items){
      if (h[it.id] || !passF(it) || isCold(it)) continue;
      if ((it.kidv || 0) < 2) continue;   // 1판(높은 음만 봄)은 엄마 목소리가 많이 섞여 안 씀
      for (const c of it.kid || []){
        if ((no[it.id] || []).some(z => Math.abs(z - c[0]) < 1)) continue;
        KC.push({id: it.id, s: c[0], e: c[1], sc: c[2] || 0, tx: c[3] || '', rec: recOf(it) || (it.added || '').slice(0, 10)});
      }
    }
    const gk = c => { if (!FAM || !c.rec) return '날짜 모름';
      const l = ageAt(FAM.lena, c.rec), t = ageAt(FAM.twins, c.rec); return '리나 만 ' + Math.max(0, l) + '세' + (t >= 0 ? ' · 둥이 만 ' + t + '세' : ''); };
    const groups = {};
    KC.sort((a, b) => b.rec.localeCompare(a.rec) || a.s - b.s);
    for (const c of KC) (groups[gk(c)] = groups[gk(c)] || []).push(c);
    const keys = Object.keys(groups);   // 최근 나이부터(목록이 날짜순이라 처음 나온 순서)
    $('count').textContent = '아이 목소리 ' + KC.length + '순간';
    if (!KC.length){ $('grid').innerHTML = '<div class="empty">아직 찾은 아이 목소리가 없어요. 맥이 녹음을 하나씩 살펴보는 중이에요.</div>'; return; }
    KG = [];
    const cur = clips ? clips[ci] : null;
    $('grid').innerHTML = '<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px">' +
      '<div class="muted" style="font-size:13px">녹음 속 높은 아이 목소리를 자동으로 찾았어요. 아이 목소리가 아니면 👎를 눌러 빼 주세요.</div>' +
      keys.map(k => {
        const all = groups[k], open = KOPEN.has(k);
        const g = open ? all : all.slice().sort((a, b) => b.sc - a.sc).slice(0, 12).sort((a, b) => b.rec.localeCompare(a.rec) || a.s - b.s);
        KG.push(g);
        return '<div class="khead"><b>👶 ' + esc(k) + ' <span class="muted" style="font-weight:400;font-size:13px">' + all.length + '순간</span></b>' +
          '<button class="chip" data-kall="' + (KG.length - 1) + '">▶ 이어 듣기</button></div>' +
          g.map(c => { const it = byId[c.id], i = KC.indexOf(c);
            return '<div class="krow' + (cur && cur.id === c.id && cur.s === c.s ? ' on' : '') + '" data-kc="' + i + '"><span class="kp">▶</span>' +
              '<div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (c.tx ? '"' + esc(c.tx) + '"' : '(아이 목소리)') + '</div>' +
              '<div class="muted" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.title) + ' · ' + c.rec.replace(/-/g, '.') + ' · ' + Math.round(c.e - c.s) + '초</div></div>' +
              '<button class="chip" data-kx="' + i + '" aria-label="아이 목소리 아님">👎</button></div>'; }).join('') +
          (!open && all.length > g.length ? '<button class="chip" data-kmore="' + esc(k) + '" style="align-self:center">더 보기 (' + (all.length - g.length) + ')</button>' : '');
      }).join('') + '</div>';
  }
  async function notKid(i){
    const c = KC[i]; if (!c) return;
    const no = kidNo(); (no[c.id] = no[c.id] || []).push(c.s); ls.set('kidno', no);
    if (INBOX){
      const ts = new Date().toISOString().replace(/[-:]/g, '').replace(/\..*/, '');
      await qPut({id: 'req_' + ts + '_kidx_' + c.id + '_' + Math.round(c.s), path: 'requests/' + ts + '_kidx_' + c.id + '_' + Math.round(c.s) + '.json',
                  data: new TextEncoder().encode(JSON.stringify({id: c.id, action: 'kidx', s: c.s, at: new Date().toISOString()}))});
      flush();
    }
    toast('빼 둘게요'); renderKid();
  }

  // 순간 듣기: 녹음을 받아 그 초로 가서 끝 초에서 다음 순간으로
  let clips = null, ci = 0;
  function playClips(idx, i){
    clips = idx.map(j => KC[j]).filter(Boolean); ci = Math.max(0, i || 0);
    if (!clips.length){ clips = null; return; }
    savePos(); queue = []; qi = -1; playClip();
  }
  function playClip(){
    const c = clips[ci], it = byId[c.id]; if (!it) return;
    const tag = 'clip:' + ci + ':' + c.id; loadingId = tag;
    $('player').classList.add('show');
    $('nt').textContent = '👶 ' + (c.tx || it.title); $('ns').textContent = '불러오는 중…'; $('pp').textContent = '⏳';
    fetchAudio(c.id).then(url => {
      if (loadingId !== tag) return;
      const go = () => { au.currentTime = c.s; au.play().catch(() => { $('pp').textContent = '▶'; }); };
      if (au.src === url && au.readyState >= 1){ au.onloadedmetadata = null; go(); }
      else { au.onloadedmetadata = go; au.src = url; }
      $('ns').textContent = it.title + ' · ' + c.rec.replace(/-/g, '.') + (clips.length > 1 ? ' · ' + (ci + 1) + '/' + clips.length : '');
      mediaSession(Object.assign({}, it, {title: '👶 ' + (c.tx || it.title)}));
      if (filter === 'kid') renderKid();
    }).catch(() => { $('ns').textContent = '재생할 수 없어요'; });
  }

  // ───── 재생 ─────
  function playQueue(ids, i){ clips = null; queue = ids; qi = Math.max(0, i); playCurrent(); }

  // 녹음은 사이트에 암호화돼 올라가 있음: 받아서 목록의 키로 풀어 재생
  const cache = new Map(); // id -> objectURL (최근 3개)
  // 녹음 받기: ① 이 폰에 받아 둔 것(최근 40개) ② 좋은 음질(R2, 약 3배 큼 — 느린 망이면 건너뜀) ③ 작은 판(GitHub)
  // 받는 동안 % 를 보여 주고, 좋은 음질이 12초 넘게 걸리면 작은 판으로 바꿔 받음
  const ACACHE = 'storytime-audio-v1';
  const slowNet = () => { const c = navigator.connection || {}; return !!(c.saveData || /2g|3g/.test(c.effectiveType || '') || (c.downlink && c.downlink < 2)); };
  async function getBuf(u, onp, ms){
    try { const c = await caches.open(ACACHE), hit = await c.match(u); if (hit) return await hit.arrayBuffer(); } catch (e) {}
    const ac = new AbortController(); const tm = ms ? setTimeout(() => ac.abort(), ms) : null;
    try {
      const r = await fetch(u, {signal: ac.signal}); if (!r.ok) throw new Error(r.status);
      const n = +r.headers.get('content-length') || 0, rd = r.body && r.body.getReader();
      let buf;
      if (rd){ const parts = []; let got = 0;
        for (;;){ const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length; if (onp) onp(got, n); }
        buf = new Uint8Array(got); let o = 0; for (const x of parts){ buf.set(x, o); o += x.length; } buf = buf.buffer;
      } else buf = await r.arrayBuffer();
      try { const c = await caches.open(ACACHE); await c.put(u, new Response(buf.slice(0)));
        const ks = await c.keys(); for (let i = 0; i < ks.length - 40; i++) await c.delete(ks[i]); } catch (e) {}
      return buf;
    } finally { if (tm) clearTimeout(tm); }
  }
  // 잠긴 녹음 풀기: 예전 형식(iv12 + 통째) 또는 조각 형식(STC1, 64KB마다 따로 잠금)
  async function decAudio(buf){
    const k = await AKEY, u8 = new Uint8Array(buf);
    if (!(u8[0] === 83 && u8[1] === 84 && u8[2] === 67 && u8[3] === 49))
      return crypto.subtle.decrypt({name:'AES-GCM', iv: u8.slice(0, 12)}, k, u8.slice(12));
    const dv = new DataView(buf), cs = dv.getUint32(4), n = Number(dv.getBigUint64(8)), iv = u8.slice(16, 28);
    const out = new Uint8Array(n); let pos = 28, i = 0, o = 0;
    while (pos < u8.length){
      const len = Math.min(cs + 16, u8.length - pos), v = iv.slice();
      new DataView(v.buffer).setUint32(8, (new DataView(v.buffer).getUint32(8) ^ i) >>> 0);
      const pt = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: v}, k, u8.slice(pos, pos + len)));
      out.set(pt, o); o += pt.length; pos += len; i++;
    }
    return out.buffer;
  }
  // 바로 재생: 서비스워커에 열쇠·R2 주소를 넘김(1초 안에 답이 없으면 못 씀)
  function swReady(){
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw || !R2 || !CATKEY) return Promise.resolve(false);
    return new Promise(res => {
      const ch = new MessageChannel(), t = setTimeout(() => res(false), 1000);
      ch.port1.onmessage = () => { clearTimeout(t); res(true); };
      sw.postMessage({type: 'skey', key: CATKEY, r2: {url: R2.url, k: R2.k}}, [ch.port2]);
    });
  }
  const canStream = it => !!(R2 && it.r2 && it.sv && it.sv === (it.hqv || it.codec || 'v'));

  function fetchAudio(id, onp){
    if (cache.has(id)) return Promise.resolve(cache.get(id));
    const it = byId[id] || {};
    const gh = 'audio/' + id + '.bin';
    const r2 = R2 && it.r2 ? R2.url + '/a/' + id + '.bin?k=' + encodeURIComponent(R2.k) + '&v=' + encodeURIComponent(it.hqv || it.codec || '') : null;
    const small = !it.cold;   // GitHub 에 작은 판이 있음
    let p;
    if (r2 && (!small || !slowNet())) p = getBuf(r2, onp, small ? 12000 : 0).catch(e => { if (!small) throw e; return getBuf(gh, onp); });
    else p = getBuf(small ? gh : r2, onp);
    return p
      .then(decAudio)
      .then(pt => {
        const url = URL.createObjectURL(new Blob([pt], {type:'audio/mp4'}));
        cache.set(id, url);
        while (cache.size > 3){ const k = cache.keys().next().value; if (k === queue[qi]) break; URL.revokeObjectURL(cache.get(k)); cache.delete(k); }
        return url;
      });
  }

  function playCurrent(){
    const id = queue[qi]; const it = byId[id]; if (!it) return;
    loadingId = id;
    $('player').classList.add('show');
    $('nt').textContent = it.title; $('ns').textContent = '불러오는 중…';
    $('pp').textContent = '⏳';
    if (!au.paused) au.pause();
    $('cur').textContent = '0:00'; $('dur').textContent = it.dur ? fmt(it.dur) : ''; $('bar').value = 0;
    if (filter === 'kid' || filter === 'history') render(); else markPlaying();
    const pos = ls.get('pos', {})[id];
    let resumeAt = 0, pre = null, started = false;
    playFail = null;
    const start = (url, streamed) => {
      if (loadingId !== id) return;
      started = true;
      au.onerror = () => {
        if (loadingId !== id) return;
        if (streamed){   // 듣는 도중 끊기면: 열쇠를 다시 넘기고 들던 곳부터 한 번 더, 그래도 안 되면 다 받아서(들던 곳부터)
          const at = au.currentTime || 0;
          resumeAt = at;
          if (pre){ pre.then(u => start(u, false)).catch(() => blobPlay()); return; }   // 미리 받아 둔 전체 파일로 바로 넘어감
          if (at > 1 && !start.again){ start.again = true; swReady().then(() => { au.src = url; au.play().catch(() => {}); }); return; }
          blobPlay(); return;
        }
        giveUp();
      };
      au.onloadedmetadata = () => {
        if (resumeAt > 1){ au.currentTime = resumeAt; resumeAt = 0; return; }
        if (pos && pos > 10 && pos < au.duration - 20){ au.currentTime = pos; toast('지난번 들은 곳부터 이어서 들려줄게요'); }
      };
      au.src = url;
      au.play().catch(() => { $('pp').textContent = '▶'; });
      $('ns').textContent = [it.reader, it.category].filter(x => x && x !== '모름').join(' · ');
      pushHistory(id);
      mediaSession(it);
      const nx = byId[queue[qi+1]]; if (nx) setTimeout(() => fetchAudio(nx.id).catch(()=>{}), 3000);   // 다음 것도 미리(화면 꺼진 채 넘어갈 때 바로 나오게)
    };
    const blobPlay = () => fetchAudio(id, (got, n) => { if (loadingId === id) $('ns').textContent = '불러오는 중… ' + (n ? Math.round(got / n * 100) + '%' : Math.round(got / 1e5) / 10 + 'MB'); })
      .then(url => start(url, false)).catch(e => {
        console.error('녹음 열기 실패', id, e);
        // 폰에 남은 받아 둔 사본이 상했을 수 있음: 지우고 한 번 더
        if (!blobPlay.retried){ blobPlay.retried = true; caches.open(ACACHE).then(c => c.keys().then(ks => Promise.all(ks.filter(k => k.url.includes(id)).map(k => c.delete(k))))).catch(()=>{}).then(blobPlay); return; }
        giveUp();
      });
    // 못 받았을 때(화면이 꺼져 폰이 인터넷을 잠깐 끊었거나 망이 불안정): 포기하지 않고 들던 곳을 기억해 두고 다시 시도
    //  화면이 켜져 있으면 3·10·30초 뒤 자동으로, 꺼져 있으면 화면을 켜거나 인터넷이 돌아올 때, ▶를 누르면 바로
    const giveUp = () => {
      if (loadingId !== id) return;
      const at = resumeAt > 1 ? resumeAt : (started ? au.currentTime || 0 : 0);   // 이 녹음을 틀기 전이면 au 시각은 앞 녹음 것
      if (at > 10){ const p = ls.get('pos', {}); p[id] = Math.floor(at); ls.set('pos', p); }
      playFail = id; $('pp').textContent = '▶';
      const n = (retryN[id] = (retryN[id] || 0) + 1);
      if (n <= 3 && document.visibilityState === 'visible' && navigator.onLine !== false){
        $('ns').textContent = '연결이 끊겨 다시 받는 중…';
        setTimeout(retryPlay, [3000, 10000, 30000][n - 1]);
      } else $('ns').textContent = '연결이 끊겼어요 · ▶를 누르면 다시 들어요';
    };
    // 바로 재생으로 시작하고, 뒤에서 전체 파일도 받아 둠: 화면을 끈 사이 바로 재생이 끊겨도 받아 둔 파일로 이어서(화면이 꺼지면 앱이 거의 멈춰 다시 받기가 늦음)
    if (canStream(it) && !cache.has(id)) swReady().then(ok => {
      if (!ok) return blobPlay();
      start('st/' + id + '.m4a?v=' + encodeURIComponent(it.sv + '.s1'), true);
      pre = new Promise(r => setTimeout(r, 1500)).then(() => loadingId === id ? fetchAudio(id) : Promise.reject('skip'));
      pre.catch(() => {});
    });
    else blobPlay();
  }

  function pushHistory(id){
    const h = ls.get('history', []).filter(x => x !== id); h.unshift(id); ls.set('history', h.slice(0, 50));
  }
  function savePos(final){
    const id = queue[qi]; if (!id || !au.duration || playFail === id) return;   // 못 튼 녹음엔 앞 녹음 시각이 남아 있음
    const pos = ls.get('pos', {});
    if (final || au.currentTime > au.duration - 20) delete pos[id]; else pos[id] = Math.floor(au.currentTime);
    ls.set('pos', pos);
  }

  function next(){ if (clips){ if (ci < clips.length - 1){ ci++; playClip(); } return; } if (qi < queue.length-1){ savePos(); qi++; playCurrent(); } }
  function prev(){ if (clips){ if (au.currentTime > clips[ci].s + 3) au.currentTime = clips[ci].s; else if (ci > 0){ ci--; playClip(); } return; }
    if (au.currentTime > 5){ au.currentTime = 0; return; } if (qi > 0){ savePos(); qi--; playCurrent(); } }
  $('next').onclick = next; $('prev').onclick = prev;
  // ✕ 플레이어 끄기: 들은 곳은 기억해 두고 멈춘 뒤 아래 막대를 숨김
  $('pClose').onclick = () => {
    savePos(); au.pause();
    if (sleep.mode) clearSleep();
    loadingId = null; clips = null; queue = []; qi = -1;
    au.onerror = null; au.onloadedmetadata = null; au.removeAttribute('src'); au.load();
    $('player').classList.remove('show');
    if ('mediaSession' in navigator){ try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch (e) {} }
    render();
  };
  // 못 받아서 멈춘 녹음 다시 틀기(▶·잠금화면 재생·화면 켜짐·인터넷 돌아옴)
  let playFail = null; const retryN = {};
  function retryPlay(){ if (playFail && queue[qi] === playFail && loadingId === playFail){ playFail = null; playCurrent(); } }
  const playOrRetry = () => { if (playFail && queue[qi] === playFail){ retryN[playFail] = 0; retryPlay(); return; } if (au.src) au.play().catch(() => {}); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playFail){ retryN[playFail] = 0; retryPlay(); } });
  window.addEventListener('online', () => { if (playFail){ retryN[playFail] = 0; retryPlay(); } });
  au.addEventListener('playing', () => { if (queue[qi]) delete retryN[queue[qi]]; });
  $('pp').onclick = () => { if (playFail && queue[qi] === playFail) return playOrRetry(); if (!au.src) return; au.paused ? au.play() : au.pause(); };
  // 멈춤 감시: 재생 중인데 20초 넘게 소리가 안 나아가면(받기가 멈춤) 끊긴 것으로 보고 다시 붙임
  let stallT = 0;
  const unstall = () => { clearTimeout(stallT); stallT = 0; };
  au.addEventListener('waiting', () => { unstall(); stallT = setTimeout(() => { if (!au.paused && au.readyState < 3 && au.onerror) au.onerror(); }, 20000); });
  ['playing', 'pause', 'emptied', 'ended'].forEach(ev => au.addEventListener(ev, unstall));
  au.onplay = () => { $('pp').textContent = '⏸'; };
  au.onpause = () => { $('pp').textContent = '▶'; savePos(); };
  au.onended = () => {
    savePos(true);
    if (sleep.mode === 'end'){ clearSleep(); toast('잘 자요 🌙'); return; }
    next();
  };
  let lastSave = 0;
  au.ontimeupdate = () => {
    if (!au.duration) return;
    if (clips && loadingId === 'clip:' + ci + ':' + clips[ci].id && au.currentTime >= clips[ci].e){
      if (ci < clips.length - 1){ ci++; playClip(); }
      else { au.pause(); clips = null; toast('▶를 누르면 그 뒤로 이어서 들어요'); if (filter === 'kid') renderKid(); }
    }
    $('cur').textContent = fmt(au.currentTime); $('dur').textContent = fmt(au.duration);
    if (!seeking) $('bar').value = Math.round(au.currentTime / au.duration * 1000);
    if (Date.now() - lastSave > 5000){ lastSave = Date.now(); savePos(); }
  };
  let seeking = false;
  $('bar').addEventListener('input', () => { seeking = true; });
  $('bar').addEventListener('change', () => { if (au.duration) au.currentTime = $('bar').value / 1000 * au.duration; seeking = false; });

  // 잠금화면·블루투스·카플레이 '지금 재생 중'·안드로이드 오토 화면에 제목·그림·버튼이 나오게
  function mediaSession(it){
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession, base = location.href.replace(/[^/]*$/, '');
    ms.metadata = new MediaMetadata({ title: it.title, artist: it.reader ? it.reader + '가 읽어줌' : '우리집 책 읽어주기',
      album: it.category || '우리집 책 읽어주기',
      artwork: [{src: base + 'icon-512.png', sizes: '512x512', type: 'image/png'}, {src: base + 'icon-192.png', sizes: '192x192', type: 'image/png'}] });
    const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
    set('play', playOrRetry);
    set('pause', () => au.pause());
    set('stop', () => au.pause());
    set('nexttrack', next);
    set('previoustrack', prev);
    set('seekbackward', d => { au.currentTime = Math.max(0, au.currentTime - (d.seekOffset || 15)); posState(); });
    set('seekforward', d => { au.currentTime = Math.min(au.duration || 0, au.currentTime + (d.seekOffset || 15)); posState(); });
    set('seekto', d => { au.currentTime = d.seekTime; posState(); });
  }
  function posState(){
    try { if (au.duration && isFinite(au.duration))
      navigator.mediaSession.setPositionState({duration: au.duration, playbackRate: au.playbackRate, position: Math.min(au.currentTime, au.duration)}); } catch (e) {}
  }
  au.addEventListener('loadedmetadata', posState);
  au.addEventListener('play', () => { try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {} posState(); });
  au.addEventListener('pause', () => { try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {} });

  // ───── 잠자기 타이머 ─────
  const sleep = { mode: null, end: 0, tick: null };
  const OPTS = [['off','끄기'],[10,'10분'],[20,'20분'],[30,'30분'],[45,'45분'],[60,'1시간'],['end','이 이야기 끝나면']];
  $('opts').innerHTML = OPTS.map(([v,l]) => '<button data-v="'+v+'"'+(v==='end'?' style="grid-column:span 2"':'')+'>'+l+'</button>').join('');
  $('sleepBtn').onclick = () => $('sheet').classList.add('show');
  $('sheet').addEventListener('click', e => {
    if (e.target === $('sheet')) return $('sheet').classList.remove('show');
    const b = e.target.closest('button[data-v]'); if (!b) return;
    const v = b.dataset.v;
    setSleep(v);
    sleep.offAt = v === 'off' ? Date.now() : 0;   // 밤에 직접 끈 건 그 밤 동안 다시 켜지 않음
    $('sheet').classList.remove('show');
    toast(v === 'off' ? '타이머를 껐어요' : '타이머를 맞췄어요');
  });
  function setSleep(v){
    clearSleep();
    if (v === 'end'){ sleep.mode = 'end'; label('😴 이번 것까지'); }
    else if (v !== 'off'){
      sleep.mode = 'time'; sleep.end = Date.now() + Number(v) * 60000;
      sleep.tick = setInterval(sleepTick, 1000); sleepTick();
    }
  }
  // 저녁 7시~새벽 5시에 재생을 시작하면 45분 타이머가 저절로 켜짐(이미 켜져 있거나, 오늘 밤 직접 껐으면 그대로)
  au.addEventListener('play', () => {
    const h = new Date().getHours();
    if (sleep.mode || !(h >= 19 || h < 5) || (sleep.offAt && Date.now() - sleep.offAt < 10 * 3600e3)) return;
    setSleep(45); toast('밤이라 45분 잠자기 타이머를 켰어요 😴');
  });
  function label(t){ $('sleepBtn').textContent = t; $('sleepBtn').classList.toggle('on', !!sleep.mode); }
  function sleepTick(){
    const left = sleep.end - Date.now();
    if (left <= 0){ au.pause(); au.volume = 1; clearSleep(); toast('잘 자요 🌙'); return; }
    if (left < 15000) au.volume = Math.max(0.05, left / 15000);
    label('😴 ' + fmt(left / 1000));
  }
  function clearSleep(){ clearInterval(sleep.tick); sleep.mode = null; au.volume = 1; label('😴'); }
})();
</script>
</body>
</html>
